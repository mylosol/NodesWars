version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'deps'
      - 'npm'
    # Packages that must move together, or the lockfile resolves to a
    # combination that installs but breaks (react-dom 19 against react 18).
    groups:
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      vite-toolchain:
        patterns:
          - 'vite'
          - 'vitest'
          - '@vitejs/*'
          - 'vite-plugin-*'
          - '@vitest/*'
          - 'jsdom'
      lint-and-format:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@typescript-eslint/*'
          - '@eslint/*'
          - 'typescript'
          - 'prettier'

    # typescript-eslint declares a peer range of typescript <6.1.0, so TS 6 and
    # 7 fail lint outright (see #40). Ignoring the major keeps the rest of the
    # group moving instead of being held back by a package that cannot land.
    # Remove this once typescript-eslint ships support.
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'composer'
    directory: '/apps/api'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'deps'
      - 'composer'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'deps'
      - 'github-actions'
