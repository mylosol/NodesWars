version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'deps'
      - 'npm'
    # Packages that must move together, or the lockfile resolves to a
    # combination that installs but breaks (react-dom 19 against react 18).
    groups:
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      vite-toolchain:
        patterns:
          - 'vite'
          - 'vitest'
          - '@vitejs/*'
          - 'vite-plugin-*'
          - '@vitest/*'
          - 'jsdom'
      lint-and-format:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@typescript-eslint/*'
          - 'prettier'

  - package-ecosystem: 'composer'
    directory: '/apps/api'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'deps'
      - 'composer'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'deps'
      - 'github-actions'
