name: Deploy production

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: SFTP to WHM production
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build PWA
        run: pnpm --filter @nodeswars/pwa build

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_pgsql, sodium
          tools: composer:v2

      - name: Install PHP deps
        working-directory: apps/api
        run: composer install --no-dev --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy to WHM production via SFTP
        env:
          SSH_KEY: ${{ secrets.WHM_SSH_KEY }}
          HOST: ${{ secrets.WHM_HOST }}
          SSH_USER: ${{ secrets.WHM_USER }}
          PORT: ${{ secrets.WHM_SSH_PORT }}
          PWA_TARGET: ${{ secrets.WHM_PROD_PWA_PATH }}
          API_TARGET: ${{ secrets.WHM_PROD_API_PATH }}
          DB_URL: ${{ secrets.DATABASE_URL }}
          DB_USER: ${{ secrets.POSTGRESQL_USER }}
          DB_PASS: ${{ secrets.POSTGRESQL_PASS }}
        run: |
          set -eo pipefail
          KEY_FILE="$(mktemp)"
          printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          CONNECT="ssh -a -x -i $KEY_FILE -p ${PORT:-22} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          lftp -c "
            set sftp:connect-program \"$CONNECT\";
            set net:max-retries 2;
            set net:timeout 20;
            set sftp:auto-confirm yes;
            open -u $SSH_USER, sftp://$HOST;
            mirror --reverse --delete --verbose --no-perms --exclude '\.htaccess' apps/pwa/dist/ \"$PWA_TARGET\";
            mirror --reverse --delete --verbose --no-perms --exclude 'tests/' --exclude '\.env' apps/api/ \"$API_TARGET\";
          "
          # The API .env is deliberately excluded from the mirror so it
          # survives deploys. Write it from the production environment
          # secrets instead (idempotent — same content every deploy).
          # Quoted heredoc: never printf, a % in a password would corrupt it.
          cat > /tmp/nodeswars-api.env <<ENVEOF
          DATABASE_URL=${DB_URL}
          DATABASE_USER=${DB_USER}
          DATABASE_PASSWORD=${DB_PASS}
          ENVEOF
          lftp -c "
            set sftp:connect-program \"$CONNECT\";
            set net:max-retries 2;
            set net:timeout 20;
            set sftp:auto-confirm yes;
            open -u $SSH_USER, sftp://$HOST;
            put /tmp/nodeswars-api.env -o \"$API_TARGET/.env\";
          "
          # Diagnostics: confirm the .env landed where the app looks for it
          # (index.php resolves __DIR__/.. = one level above public/). Only
          # booleans and paths are printed — never secret values.
          # Heredoc into `bash -s`: $API_TARGET expands LOCALLY (it is a
          # workflow env), \$vars stay literal for the remote shell.
          ssh -a -x -i "$KEY_FILE" -p ${PORT:-22} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$SSH_USER@$HOST" bash -s <<DIAGEOF
            API_TARGET="$API_TARGET"
            echo "diag API_TARGET=\$API_TARGET"
            if [ -f "\$API_TARGET/.env" ]; then echo "diag env_exists=yes"; else echo "diag env_exists=NO"; fi
            if [ -f "\$API_TARGET/public/index.php" ]; then echo "diag index_php=yes"; else echo "diag index_php=NO"; fi
            grep -c "^DATABASE_" "\$API_TARGET/.env" 2>/dev/null | sed "s/^/diag env_lines=/"
          DIAGEOF
          rm -f "$KEY_FILE" /tmp/nodeswars-api.env
