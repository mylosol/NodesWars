name: Deploy production

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: SFTP to WHM production
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build PWA
        run: pnpm --filter @nodeswars/pwa build

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_pgsql, sodium
          tools: composer:v2

      - name: Install PHP deps
        working-directory: apps/api
        run: composer install --no-dev --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy to WHM production via SFTP
        env:
          SSH_KEY: ${{ secrets.WHM_SSH_KEY }}
          HOST: ${{ secrets.WHM_HOST }}
          SSH_USER: ${{ secrets.WHM_USER }}
          PORT: ${{ secrets.WHM_SSH_PORT }}
          PWA_TARGET: ${{ secrets.WHM_PROD_PWA_PATH }}
          API_TARGET: ${{ secrets.WHM_PROD_API_PATH }}
          DB_URL: ${{ secrets.DATABASE_URL }}
          DB_USER: ${{ secrets.POSTGRESQL_USER }}
          DB_PASS: ${{ secrets.POSTGRESQL_PASS }}
        run: |
          set -eo pipefail
          KEY_FILE="$(mktemp)"
          printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          CONNECT="ssh -a -x -i $KEY_FILE -p ${PORT:-22} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          lftp -c "
            set sftp:connect-program \"$CONNECT\";
            set net:max-retries 2;
            set net:timeout 20;
            set sftp:auto-confirm yes;
            open -u $SSH_USER, sftp://$HOST;
            mirror --reverse --delete --verbose --no-perms --exclude '\.htaccess' apps/pwa/dist/ \"$PWA_TARGET\";
            mirror --reverse --delete --verbose --no-perms --exclude 'tests/' --exclude '\.env' apps/api/ \"$API_TARGET\";
          "
          # The API .env is deliberately excluded from the mirror so it
          # survives deploys. Write it from the production environment
          # secrets instead (idempotent - same content every deploy).
          # Quoted heredoc: never printf, a % in a password would corrupt it.
          cat > /tmp/nodeswars-api.env <<ENVEOF
          DATABASE_URL=${DB_URL}
          DATABASE_USER=${DB_USER}
          DATABASE_PASSWORD=${DB_PASS}
          ENVEOF
          lftp -c "
            set sftp:connect-program \"$CONNECT\";
            set net:max-retries 2;
            set net:timeout 20;
            set sftp:auto-confirm yes;
            open -u $SSH_USER, sftp://$HOST;
            put /tmp/nodeswars-api.env -o \"$API_TARGET/.env\";
          "
          rm -f "$KEY_FILE" /tmp/nodeswars-api.env

      - name: 'Apply DB migrations on host (idempotent)'
        if: always()
        env:
          SSH_KEY: ${{ secrets.WHM_SSH_KEY }}
          HOST: ${{ secrets.WHM_HOST }}
          SSH_USER: ${{ secrets.WHM_USER }}
          PORT: ${{ secrets.WHM_SSH_PORT }}
          API_TARGET: ${{ secrets.WHM_PROD_API_PATH }}
        run: |
          set -eo pipefail
          KEY_FILE="$(mktemp)"
          printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          CONNECT="ssh -a -x -i $KEY_FILE -p ${PORT:-22} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          # Upload the migration files, then run them on the host via the
          # host's psql (Postgres is local). Connection params are read from
          # the .env the deploy just wrote. Migrations use IF NOT EXISTS, so
          # re-running is safe.
          lftp -c "
            set sftp:connect-program \"$CONNECT\";
            set net:max-retries 2;
            set net:timeout 20;
            set sftp:auto-confirm yes;
            open -u $SSH_USER, sftp://$HOST;
            mkdir -p /tmp/nodeswars-migrations;
            put -O /tmp/nodeswars-migrations db/migrations/0001_players.sql;
            put -O /tmp/nodeswars-migrations db/migrations/0002_matches.sql;
            put -O /tmp/nodeswars-migrations db/migrations/0003_match_players.sql;
            put -O /tmp/nodeswars-migrations db/migrations/0004_ledger_blocks.sql;
            put -O /tmp/nodeswars-migrations db/migrations/0005_npns.sql;
            put -O /tmp/nodeswars-migrations db/migrations/0006_leaderboards.sql;
          "
          $CONNECT "$SSH_USER@$HOST" "bash -s '$API_TARGET'" <<'MIGEOF'
            set -e
            ENV_FILE="$1/.env"
            DB_URL="$(grep '^DATABASE_URL=' "$ENV_FILE" | tail -1 | cut -d= -f2-)"
            DB_USER="$(grep '^DATABASE_USER=' "$ENV_FILE" | tail -1 | cut -d= -f2-)"
            DB_PASS="$(grep '^DATABASE_PASSWORD=' "$ENV_FILE" | tail -1 | cut -d= -f2-)"
            export PGPASSWORD="$DB_PASS"
            DB_HOST="$(echo "$DB_URL" | sed -n 's/.*host=\([^;]*\).*/\1/p')"
            DB_PORT="$(echo "$DB_URL" | sed -n 's/.*port=\([^;]*\).*/\1/p')"
            DB_NAME="$(echo "$DB_URL" | sed -n 's/.*dbname=\([^;]*\).*/\1/p')"
            DB_PORT="${DB_PORT:-5432}"
            PSQL="psql -h $DB_HOST -p $DB_PORT -U $DB_USER -d $DB_NAME -v ON_ERROR_STOP=1"
            # pgcrypto provides gen_random_uuid() on old PG; on PG13+ it is a
            # built-in. Creating the extension can fail if the role lacks
            # privilege, so make it non-fatal (the built-in covers us).
            $PSQL -c "CREATE EXTENSION IF NOT EXISTS pgcrypto" || echo "migrate NOTICE: pgcrypto extension not created (may be built-in)"
            for f in /tmp/nodeswars-migrations/00*.sql; do
              echo "migrate: $(basename "$f")"
              if $PSQL -f "$f" 2>/tmp/mig.err; then
                echo "migrate OK: $(basename "$f")"
              else
                echo "migrate FAILED: $(basename "$f")"
                cat /tmp/mig.err
              fi
            done
            echo "migrate done"
          MIGEOF
          rm -f "$KEY_FILE"

      - name: 'Probe DB connection on host (safe: lengths + exception class only)'
        if: always()
        env:
          SSH_KEY: ${{ secrets.WHM_SSH_KEY }}
          HOST: ${{ secrets.WHM_HOST }}
          SSH_USER: ${{ secrets.WHM_USER }}
          PORT: ${{ secrets.WHM_SSH_PORT }}
          API_TARGET: ${{ secrets.WHM_PROD_API_PATH }}
        run: |
          set -eo pipefail
          KEY_FILE="$(mktemp)"
          printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          CONNECT="ssh -a -x -i $KEY_FILE -p ${PORT:-22} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          # Upload the probe, then run it on the host. It prints ONLY
          # booleans/lengths/exception class+code - never secret values.
          lftp -c "
            set sftp:connect-program \"$CONNECT\";
            set net:max-retries 2;
            set net:timeout 20;
            set sftp:auto-confirm yes;
            open -u $SSH_USER, sftp://$HOST;
            put scripts/diag-api-env.sh -o /tmp/diag-api-env.sh;
          "
          $CONNECT "$SSH_USER@$HOST" "bash /tmp/diag-api-env.sh '$API_TARGET'" || true
          rm -f "$KEY_FILE"
