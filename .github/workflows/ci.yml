name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The two engines must agree, so the weapon tables are generated rather
      # than hand-written. This fails if they drift from data/weapons.json.
      - name: Weapon tables up to date
        run: pnpm gen:weapons:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm -r --if-present lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  php:
    name: PHP
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo, pdo_pgsql, sodium
          coverage: none
          tools: composer:v2, phpunit, phpstan, php-cs-fixer

      - name: Install
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHPUnit
        run: ./vendor/bin/phpunit

      - name: PHPStan
        run: ./vendor/bin/phpstan analyse --no-progress

      - name: PHP CS Fixer
        run: ./vendor/bin/php-cs-fixer fix --dry-run --diff
