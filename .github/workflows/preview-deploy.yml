name: Deploy preview

on:
  pull_request:
    types: [opened, reopened, labeled, synchronize]
    branches: [main]

concurrency:
  group: preview-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: rsync to WHM preview
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'deploy-preview')
    environment: preview
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build PWA
        run: pnpm --filter @nodeswars/pwa build

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo, pdo_pgsql, sodium
          tools: composer:v2

      - name: Install PHP deps
        working-directory: apps/api
        run: composer install --no-dev --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Diagnose SFTP paths (read only, temporary)
        env:
          SSH_KEY: ${{ secrets.WHM_SSH_KEY }}
          HOST: ${{ secrets.WHM_HOST }}
          SSH_USER: ${{ secrets.WHM_USER }}
          PORT: ${{ secrets.WHM_SSH_PORT }}
        run: |
          set -eo pipefail
          KEY_FILE="$(mktemp)"
          printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          CONNECT="ssh -a -x -i $KEY_FILE -p ${PORT:-22} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          run_lftp() {
            lftp -c "set sftp:connect-program \"$CONNECT\"; set sftp:auto-confirm yes; open -u $SSH_USER, sftp://$HOST; $1" || true
          }
          echo '=== starting directory (your SFTP home) ==='
          run_lftp 'pwd; ls -la'
          echo '=== domains/ (pwd prints its absolute path) ==='
          run_lftp 'cd domains; pwd; ls -la'
          echo '=== domains/preview.nodeswars.com/ ==='
          run_lftp 'cd domains/preview.nodeswars.com; pwd; ls -la'
          echo '=== domains/api-preview.nodeswars.com/ ==='
          run_lftp 'cd domains/api-preview.nodeswars.com; pwd; ls -la'
          rm -f "$KEY_FILE"

      # TEMP: live deploy disabled while we confirm the correct SFTP paths from
      # the diagnostic above. Remove this `if: false` and the diagnostic step
      # once WHM_PREVIEW_PWA_PATH / WHM_PREVIEW_API_PATH are verified.
      - name: Deploy to WHM preview via SFTP
        if: ${{ false }}
        env:
          SSH_KEY: ${{ secrets.WHM_SSH_KEY }}
          HOST: ${{ secrets.WHM_HOST }}
          SSH_USER: ${{ secrets.WHM_USER }}
          PORT: ${{ secrets.WHM_SSH_PORT }}
          PWA_TARGET: ${{ secrets.WHM_PREVIEW_PWA_PATH }}
          API_TARGET: ${{ secrets.WHM_PREVIEW_API_PATH }}
        run: |
          set -eo pipefail
          KEY_FILE="$(mktemp)"
          printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          CONNECT="ssh -a -x -i $KEY_FILE -p ${PORT:-22} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          lftp -c "
            set sftp:connect-program \"$CONNECT\";
            set net:max-retries 2;
            set net:timeout 20;
            set sftp:auto-confirm yes;
            open -u $SSH_USER, sftp://$HOST;
            mirror --reverse --delete --verbose --no-perms --exclude '\.htaccess' apps/pwa/dist/ \"$PWA_TARGET\";
            mirror --reverse --delete --verbose --no-perms --exclude 'tests/' --exclude '\.env' --exclude '\.htaccess' apps/api/ \"$API_TARGET\";
          "
          rm -f "$KEY_FILE"
