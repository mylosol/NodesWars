name: Bug report
description: Something is broken.
title: 'bug: '
labels: ['bug']
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build or commit SHA
      placeholder: e.g. 0.1.0 or a git SHA
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - pwa
        - api
        - engine
        - db
        - infra
        - other
    validations:
      required: true
